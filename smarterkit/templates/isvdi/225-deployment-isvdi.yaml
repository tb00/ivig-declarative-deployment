{{- if .Values.general.install.deployIsvdi }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isvdi
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.services.isvdi.replicas | default 1 }}
  {{- if eq .Values.storage.mode "ReadWriteOnce" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: isvdi
  template:
    metadata:
      labels:
        app: isvdi
        {{- include "extra" (list . "labels.pod.isvdi") }}
      annotations:
        {{- include "extra" (list . "annotations.pod.isvdi") }}
    spec:
      {{- if not .Values.isOpenShift }}
      securityContext:
        fsGroup: 0
      {{- end }}
      volumes:
      - name: certs
        secret:
          secretName: isvdicerts
          defaultMode: 0440
      - name: init
        configMap:
          name: isvgimsdi
          defaultMode: 0555
      - name: adapters
        persistentVolumeClaim:
          claimName: isvdi-pvc
      imagePullSecrets:
      - name: regcred
      containers:
      - name: isvdi
        image: {{ .Values.images.isvdi }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.services.isvdi.ports.api }}
          name: api
          protocol: TCP
        - containerPort: {{ .Values.services.isvdi.ports.object }}
          name: object
          protocol: TCP
        env:
        - name: YAML_CONFIG_FILE
          value: /home/isvdi/init/isvdi_config.yaml
        - name: TZ
          value: ":{{ .Values.timezone }}"
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        volumeMounts:
        - name: certs
          mountPath: /tmp/isvgimsdi
        - name: adapters
          mountPath: /opt/IBM/svgadapters
        - name: init
          mountPath: /home/isvdi/init
{{- end }}
